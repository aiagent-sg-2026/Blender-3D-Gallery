<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Blink prototype</title>
<style>html,body{margin:0;height:100%;background:#ebeaf7}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const W = 640, H = 640;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xebeaf7);
scene.add(new THREE.HemisphereLight(0xffffff, 0xd9d8ea, 2.0));
const key = new THREE.DirectionalLight(0xfff6ee, 1.8); key.position.set(-1, 1.6, 2.4); scene.add(key);
const cam = new THREE.PerspectiveCamera(22, 1, 0.05, 20);
const az = THREE.MathUtils.degToRad(Number(q.get('az') ?? 0));
cam.position.set(Math.sin(az) * 1.4, 0.82, Math.cos(az) * 1.4); cam.lookAt(0, 0.78, 0);
const gltf = await new GLTFLoader().loadAsync(q.get('glb') ?? '/out/blink-prototype-lid.glb');
scene.add(gltf.scene);
const meshes = [];
gltf.scene.traverse((o) => { if (o.morphTargetInfluences?.length) meshes.push(o); });
window.__info = Object.fromEntries(meshes.map((m) => [m.name, Object.keys(m.morphTargetDictionary)]));
// the runtime drives every mesh that carries a key of that name
window.setKeys = (v) => { for (const m of meshes) { m.morphTargetInfluences.fill(0); for (const [k, x] of Object.entries(v)) if (k in m.morphTargetDictionary) m.morphTargetInfluences[m.morphTargetDictionary[k]] = x; } r.render(scene, cam); };
window.setKeys({}); window.__ready = true;
</script></body></html>
